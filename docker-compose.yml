version: '3.8'

services:
  animeoverseer:
    build: .
    ports:
      - "7272:7272"
      - "7273:7273"
    volumes:
      - animeoverseer_db:/app/data
      - animeoverseer_wwwroot:/app/wwwroot
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/animeoverseer.db
      - ASPNETCORE_URLS=http://+:7272

volumes:
  animeoverseer_db:
  animeoverseer_wwwroot:
