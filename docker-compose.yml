version: '3.8'

services:
  animeoverseer:
    build: .
    ports:
      - "7272:7272"
      - "7273:7273"
    volumes:
      - animeoverseer_db:/app/data
      # Persist only generated artwork; mounting all of wwwroot masks CSS and JS
      # shipped by rebuilt application images.
      - animeoverseer_image_cache:/app/wwwroot/images/cache
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/animeoverseer.db
      - ASPNETCORE_URLS=http://+:7272

volumes:
  animeoverseer_db:
  animeoverseer_image_cache:
